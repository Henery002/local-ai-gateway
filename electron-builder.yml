appId: com.henery.local-ai-gateway
productName: Local AI Gateway
directories:
  output: release
  buildResources: apps/desktop/assets/icons/generated
files:
  - apps/**/dist/**
  - apps/desktop/static/**
  - apps/desktop/assets/**/*
  - packages/**/dist/**
  - packages/**/package.json
  - node_modules/**/*
  - package.json
  - package-lock.json
  - "!node_modules/@types/**"
  - "!node_modules/.bin/**"
  - "!node_modules/electron{,/**}"
  - "!node_modules/electron-builder{,/**}"
  - "!node_modules/tsx{,/**}"
  - "!node_modules/typescript{,/**}"
  - "!node_modules/vitest{,/**}"
asar: true
asarUnpack:
  - node_modules/**/*.node
mac:
  category: public.app-category.developer-tools
  icon: app-icon.icns
  target:
    - zip
    - dmg
dmg:
  icon: app-icon.icns
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
