<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="cardMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="loopGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow-sm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15" flood-color="#0f172a" />
    </filter>
    <filter id="shadow-lg" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="12" dy="24" stdDeviation="24" flood-opacity="0.25" flood-color="#0f172a" />
    </filter>
    <filter id="shadow-xl" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="16" dy="32" stdDeviation="32" flood-opacity="0.3" flood-color="#020617" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(96 104) scale(0.82)">
    <rect x="420" y="160" width="440" height="440" rx="110" fill="url(#cardBack)" filter="url(#shadow-sm)" stroke="#ffffff" stroke-width="8" stroke-opacity="0.32" />
    <path d="M 440 270 Q 420 160 530 160" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.4" />

    <rect x="290" y="290" width="440" height="440" rx="110" fill="url(#cardMid)" filter="url(#shadow-lg)" stroke="#ffffff" stroke-width="8" stroke-opacity="0.42" />
    <path d="M 310 400 Q 290 290 400 290" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.4" />

    <path d="M 760 260 C 1000 350, 950 650, 680 650" fill="none" stroke="url(#loopGrad)" stroke-width="36" stroke-linecap="round" filter="url(#glow)" />
    <polygon points="690,600 640,650 690,700" fill="#EC4899" filter="url(#glow)" />

    <rect x="160" y="420" width="440" height="440" rx="110" fill="url(#cardFront)" filter="url(#shadow-xl)" stroke="#ffffff" stroke-width="10" stroke-opacity="0.5" />
    <path d="M 180 530 Q 160 420 270 420" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.4" />

    <g transform="translate(230, 520)">
      <path d="M 90 220 L 150 60 L 210 220" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="110" y1="160" x2="190" y2="160" stroke="#ffffff" stroke-width="40" stroke-linecap="round" />
      <line x1="270" y1="120" x2="270" y2="220" stroke="#ffffff" stroke-width="44" stroke-linecap="round" />
      <path d="M 270 10 Q 270 50 230 50 Q 270 50 270 90 Q 270 50 310 50 Q 270 50 270 10 Z" fill="#ffffff" filter="url(#glow)" />
    </g>
  </g>
</svg>
